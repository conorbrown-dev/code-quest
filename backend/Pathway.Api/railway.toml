[build]
# The Railway service root is backend/Pathway.Api; paths below are relative to its checkout.
builder = "RAILPACK"
buildCommand = "dotnet publish -c Release -r linux-x64 --self-contained true -o /app/out"
watchPatterns = ["backend/Pathway.Api/**"]

[deploy]
startCommand = "/app/out/Pathway.Api --urls http://0.0.0.0:$PORT"
healthcheckPath = "/ready"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
