[build]
# The Railway service root is backend/Pathway.Api; paths below are relative to its checkout.
builder = "RAILPACK"
buildCommand = "dotnet publish -c Release -o /app/publish"
watchPatterns = ["backend/Pathway.Api/**"]

[deploy]
startCommand = "dotnet /app/publish/Pathway.Api.dll --urls http://0.0.0.0:$PORT"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
