[build]
# The Railway service root is infra/keycloak, so this Dockerfile is resolved locally.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["infra/keycloak/**"]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
