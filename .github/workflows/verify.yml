name: Verify Pathway

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/Pathway.Api/**'
      - 'evaluator/Pathway.Evaluator/**'
      - 'infra/keycloak/**'
      - 'modal-broker/**'
      - 'docker-compose.keycloak.yml'
      - '.github/workflows/verify.yml'

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  api:
    name: API build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/Pathway.Api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release

  evaluator:
    name: Evaluator build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluator/Pathway.Evaluator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release

  modal-broker:
    name: Modal broker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modal-broker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modal-broker/package-lock.json
      - run: npm ci
      - run: npm test

  browser-e2e:
    name: Complete local browser E2E suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: dotnet build --configuration Release
        working-directory: backend/Pathway.Api
      - run: |
          ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://127.0.0.1:5100 dotnet run --configuration Release --no-build --no-launch-profile > /tmp/pathway-api.log 2>&1 &
          echo $! > /tmp/pathway-api.pid
        working-directory: backend/Pathway.Api
      - run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5100/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pathway-api.log || true
          exit 1
      - run: PLAYWRIGHT_VITE_API_BASE_URL=http://127.0.0.1:5100 npm run test:e2e
        working-directory: frontend

  keycloak-config:
    name: Keycloak configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m json.tool infra/keycloak/realm-import/pathway-realm.json > /dev/null
      - run: docker compose --env-file .env.keycloak.example -f docker-compose.keycloak.yml config > /dev/null
